server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The product catalogue is backend-owned. It must never be reachable from
    # the frontend, so the path fails loudly instead of falling through to the
    # SPA shell and looking like it exists.
    location = /products.json {
        default_type application/json;
        return 404 '{"detail":"کاتالوگ متعلق به بک‌اند است و از فرانت‌اند سرو نمی‌شود."}';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|woff2?|ttf|png|jpg|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
